# Inventario de ejemplo.
# Reemplaza las IPs / hostnames por los de tus VMs Rocky Linux 9.
# Si un mismo servidor presta ambos servicios, agrégalo a los dos grupos.

[dns_servers]
dns01 ansible_host=192.168.100.10

[dhcp_servers]
dhcp01 ansible_host=192.168.100.10

[rocky9:children]
dns_servers
dhcp_servers

[rocky9:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
