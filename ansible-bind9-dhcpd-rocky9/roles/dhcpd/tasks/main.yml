---
- name: Instalar paquete dhcp-server
  ansible.builtin.dnf:
    name: "{{ dhcp_packages }}"
    state: present

- name: Desplegar dhcpd.conf
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: "{{ dhcp_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart dhcpd

- name: Validar sintaxis de dhcpd.conf
  ansible.builtin.command:
    cmd: "dhcpd -t -cf {{ dhcp_config_file }}"
  register: dhcpd_check
  changed_when: false

- name: Abrir servicio DHCP en firewalld
  ansible.posix.firewalld:
    service: dhcp
    permanent: true
    immediate: true
    state: enabled

- name: Habilitar e iniciar el servicio dhcpd
  ansible.builtin.service:
    name: "{{ dhcp_service }}"
    state: started
    enabled: true
