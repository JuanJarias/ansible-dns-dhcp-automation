---
- name: Instalar paquetes de BIND9
  ansible.builtin.dnf:
    name: "{{ bind_packages }}"
    state: present

- name: Desplegar named.conf
  ansible.builtin.template:
    src: named.conf.j2
    dest: "{{ bind_named_conf }}"
    owner: root
    group: named
    mode: "0640"
    validate: "named-checkconf %s"
  notify: restart named

- name: Desplegar zona directa (forward)
  ansible.builtin.template:
    src: forward.zone.j2
    dest: "{{ bind_zones_dir }}/{{ lab_domain }}.zone"
    owner: root
    group: named
    mode: "0640"
  notify: restart named

- name: Desplegar zona inversa (reverse)
  ansible.builtin.template:
    src: reverse.zone.j2
    dest: "{{ bind_zones_dir }}/{{ lab_reverse_zone }}.zone"
    owner: root
    group: named
    mode: "0640"
  notify: restart named

- name: Validar sintaxis de la zona directa
  ansible.builtin.command:
    cmd: "named-checkzone {{ lab_domain }} {{ bind_zones_dir }}/{{ lab_domain }}.zone"
  register: check_forward
  changed_when: false
  failed_when: "'OK' not in check_forward.stdout"

- name: Validar sintaxis de la zona inversa
  ansible.builtin.command:
    cmd: "named-checkzone {{ lab_reverse_zone }} {{ bind_zones_dir }}/{{ lab_reverse_zone }}.zone"
  register: check_reverse
  changed_when: false
  failed_when: "'OK' not in check_reverse.stdout"

- name: Restaurar contexto SELinux de los archivos de zona
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ bind_zones_dir }}"
  register: selinux_restore
  changed_when: "'Relabeled' in selinux_restore.stdout"

- name: Abrir servicio DNS en firewalld
  ansible.posix.firewalld:
    service: dns
    permanent: true
    immediate: true
    state: enabled

- name: Habilitar e iniciar el servicio named
  ansible.builtin.service:
    name: "{{ bind_service }}"
    state: started
    enabled: true
