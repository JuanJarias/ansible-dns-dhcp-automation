---
# Parámetros específicos del rol bind9
bind_zone_serial: 2026091101   # Formato YYYYMMDDxx. Increméntalo manualmente al cambiar zonas.
bind_ttl: "1D"
bind_admin_email: "admin.lab.icesi.local."

bind_forward_records:
  - { name: "ns1",  ip: "192.168.100.10" }
  - { name: "dhcp1", ip: "192.168.100.10" }
  - { name: "www",  ip: "192.168.100.20" }

bind_allow_query: ["192.168.100.0/24", "127.0.0.1"]
bind_forwarders: ["8.8.8.8", "1.1.1.1"]
