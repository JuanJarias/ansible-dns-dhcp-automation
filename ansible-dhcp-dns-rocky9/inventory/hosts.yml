---
# Inventario estático. La IP coincide con la red privada definida en el
# Vagrantfile (192.168.56.10). El archivo .vagrant-ssh-config se genera
# con `vagrant ssh-config dns-dhcp01 > .vagrant-ssh-config` (ver README,
# sección de comandos de ejecución) y contiene la clave privada y el
# puerto correctos, que cambian según el provider (libvirt/virtualbox).
all:
  vars:
    ansible_ssh_common_args: >-
      -F {{ playbook_dir }}/.vagrant-ssh-config
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null

  children:

    dhcp_servers:
      hosts:
        dns-dhcp01:
          ansible_host: 192.168.56.10

    dns_servers:
      hosts:
        dns-dhcp01:
          ansible_host: 192.168.56.10
